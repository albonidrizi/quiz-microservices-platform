spring.application.name=question-service
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/questiondb
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

eureka.client.serviceUrl.defaultZone=http://${EUREKA_HOST:localhost}:8761/eureka
app.internal-api-key=${INTERNAL_API_KEY}

management.endpoints.web.exposure.include=health,info,prometheus
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:0.1}
