spring.application.name=api-gateway
server.port=8765

eureka.client.serviceUrl.defaultZone=http://${EUREKA_HOST:localhost}:8761/eureka
eureka.client.registry-fetch-interval-seconds=5

spring.cloud.gateway.routes[0].id=quiz-service
spring.cloud.gateway.routes[0].uri=lb://quiz-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/quiz/**
spring.cloud.gateway.routes[0].filters[0].name=RequestRateLimiter
spring.cloud.gateway.routes[0].filters[0].args.redis-rate-limiter.replenishRate=10
spring.cloud.gateway.routes[0].filters[0].args.redis-rate-limiter.burstCapacity=20
spring.cloud.gateway.routes[0].filters[0].args.key-resolver=#{@userKeyResolver}

# Never expose discovered internal services automatically.
spring.cloud.gateway.discovery.locator.enabled=false

management.endpoints.web.exposure.include=health,info,prometheus,gateway
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:0.1}

spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=${CORS_ALLOWED_ORIGIN:http://localhost:3000}
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=Content-Type,Authorization
